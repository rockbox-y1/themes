# Theme: Pixel Computer
# Version 1.0
# Last Update: 06Dec25
# License: CC-BY-SA 3.0
# By: Monica G.
# By: rockbox-y1 (360p conversion)
# Description: Simple pixel art of an old PC! Changing the background color changes some elements in the WPS, but kept all other menus/screens grey-scale.
# Code based on OneBit_OLED by Jihoon Kim and SNARTY by Simon Anden!
# Icons/elements also altered from OneBit_OLED by Jihoon Kim and SNARTY by Simon Anden!

wps: /sdcard/.rockbox/wps/Pixel_Computer.wps
sbs: /sdcard/.rockbox/wps/Pixel_Computer.sbs
selector type: bar(color)
line selector start color: ffffff
line selector end color: ffffff
line selector text color: 000000
font:/sdcard/.rockbox/fonts/18-Terminus.fnt
background color: 33CCFF
foreground color: ffffff
statusbar: off
scrollbar: on
show icons: off
filetype colours: -
