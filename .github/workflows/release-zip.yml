name: Release Themes Zip

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Create themes zip
        run: |
          THEME_DIRS=()
          for dir in */; do
            THEME_DIRS+=("$(basename "$dir")")
          done
          zip -r themes_individual.zip "${THEME_DIRS[@]}"

      - name: Create themepack zip
        run: |
          mkdir -p themepack_tmp/.rockbox
          for dir in */; do
            theme_name="$(basename "$dir")"
            [ "$theme_name" = "themepack_tmp" ] && continue
            if [ -d "$dir/.rockbox" ]; then
              cp -r "$dir/.rockbox/"* themepack_tmp/.rockbox/
            fi
          done
          cd themepack_tmp
          zip -r ../themepack.zip .
          cd ..

      - name: Upload themes_individual to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload for_the_gays_and_the_theys themes_individual.zip --clobber

      - name: Upload themepack to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload for_the_gays_and_the_theys themepack.zip --clobber
