# Theme Name: Terminal320
# Theme design: Dylan Westford
# 360p conversion by rockbox-y1
# Target: Aigo Eros Q, 320x240 colour LCD; standard Rockbox build
# Version: 1.4
# Last updated: 2026-10-28
# Original skin/layout and graphics: CC0 1.0 Universal.
# Third-party font licenses: see /.rockbox/docs/Terminal320/FONT-SOURCES.txt
# Font-pack dependency: 16-Terminus-Bold.fnt (not bundled).
# EDITING BASICS: # starts a comment. Settings use name: value.
# Select Terminal320 again after editing to reload these settings.
# SKIN FILES: now-playing layout (.wps) and menus/status/USB layout (.sbs).
wps: /sdcard/.rockbox/wps/Terminal320.wps
sbs: /sdcard/.rockbox/wps/Terminal320.sbs
# DEFAULT MENU FONT: skin viewports may override this with their own font IDs.
font: /sdcard/.rockbox/fonts/20-LanaPixel-T320.fnt
# GLOBAL COLOURS: - disables the global backdrop; the skins load their own.
# RGB hex: green foreground on black. Skin %Vf/%Vb values override these locally.
backdrop: -
foreground color: 72f6a4
background color: 000000
# MENU SELECTION: dark green fill with pale mint text.
# The SBS also sets these colours in its custom row template; keep them in sync.
line selector start color: 083c20
line selector end color: 083c20
line selector text color: cdffe8
selector type: bar (color)
# STANDARD UI: hide built-in status bar, scrollbar and icons for a clean terminal.
# The WPS/SBS provide the custom header, battery and menu row styling.
statusbar: off
scrollbar: off
show icons: off
list separator height: 0
# DEFAULT UI VIEWPORT: - clears a global override; the SBS defines menu geometry.
ui viewport: -
