#SNESPOD - SNES cartridge theme for iPod Video 5.5G (ipodvideo 320x240)
# 360p conversion by rockbox-y1
wps: /sdcard/.rockbox/wps/snespod.wps
sbs: /sdcard/.rockbox/wps/snespod.sbs
fms: /sdcard/.rockbox/wps/snespod.fms
font: /sdcard/.rockbox/fonts/superfami_14.fnt
statusbar: top
show icons: on
iconset: /sdcard/.rockbox/icons/snespod_icons.bmp
selector type: bar (gradient)
foreground color: 2C2C38
background color: C8C9D2
line selector start color: BEA8E0
line selector end color: 6850A6
line selector text color: FFFFFF
backdrop: /sdcard/.rockbox/backdrops/snespod.bmp
