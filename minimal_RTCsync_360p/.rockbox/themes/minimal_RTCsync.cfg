#--CFG File--

wps: /sdcard/.rockbox/wps/minimal_RTCsync.wps
sbs: /sdcard/.rockbox/wps/minimal_RTCsync.sbs
selector type: bar (inverse)
font: /sdcard/.rockbox/fonts/20-SFProText-Regular.fnt
background color: 181C18
foreground color: C3C3C3
statusbar: off
scrollbar: on
iconset: /sdcard/.rockbox/icons/minimal_RTCsync_icons.bmp
viewers iconset: /sdcard/.rockbox/icons/minimal_RTCsync_viewers.bmp
show icons: on
filetype colours: -