# Iris Morning - neutral light
# Iris theme for Rockbox, 320x240
# 360p conversion by rockbox-y1
wps: /sdcard/.rockbox/wps/iris-morning.wps
sbs: /sdcard/.rockbox/wps/iris-morning.sbs
font: /sdcard/.rockbox/fonts/24-Inter-Medium.fnt
iconset: /sdcard/.rockbox/icons/iris-blank.bmp
viewers iconset: /sdcard/.rockbox/icons/iris-blank.bmp
show icons: on
foreground color: 585460
background color: f0f0e8
line selector start color: 887c90
line selector end color: 887c90
line selector text color: f8f8f0
selector type: bar (gradient)
filetype colours: -
backdrop: -
statusbar: top
scrollbar: off
ui viewport: -
